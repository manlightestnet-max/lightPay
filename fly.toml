# fly.toml app configuration file for LightWallet Core Engine
app = 'lightwallet-api'
primary_region = 'cdg'

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  DEFAULT_CURRENCY = 'CREDIT'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
